apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- resources/namespace.yaml
- https://github.com/argoproj/argo-cd/manifests/ha/cluster-install?ref=v2.6.8

patches:
- path: patches/argocd-cm.yaml
  target:
    kind: ConfigMap
    name: argocd-cm
- path: patches/argocd-server-deployment.yaml
  target:
    kind: Deployment
    name: argocd-server
- path: patches/argocd-repo-server-deployment.yaml
  target:
    kind: Deployment
    name: argocd-repo-server
- path: patches/argocd-application-controller-statefulset.yaml
  target:
    kind: StatefulSet
    name: argocd-application-controller
- path: patches/argocd-cmd-params-cm-patch.yaml
  target:
    kind: ConfigMap
    name: argocd-cmd-params-cm